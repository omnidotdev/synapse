# ------------------------------------
# Failover
# ------------------------------------

[llm.failover]
enabled = true
max_attempts = 2

# Only current, priced models. With max_attempts = 2 a failed model falls back
# to the first other member of the first group listing it, so each group is
# ordered for that first fallback to cross vendors (an outage at one provider
# never fails over to the same provider). Explicit `provider/model` requests
# and product keys outside their policy never fail over
[[llm.failover.equivalence_groups]]
name = "frontier"
models = ["anthropic/claude-sonnet-5-5", "openai/gpt-4o", "nvidia/moonshotai/kimi-k2.5"]

[[llm.failover.equivalence_groups]]
name = "premium"
models = ["anthropic/claude-opus-5-5", "openai/gpt-4o"]

[[llm.failover.equivalence_groups]]
name = "fast"
models = ["anthropic/claude-haiku-5-5", "openai/gpt-4o-mini"]

[llm.failover.circuit_breaker]
error_threshold = 5
window_seconds = 60
recovery_seconds = 30

# ------------------------------------
# Embeddings
# ------------------------------------

[embeddings.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"

# ------------------------------------
# Image Generation
# ------------------------------------

[imagegen.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"

# ------------------------------------
# Speech-to-Text
# ------------------------------------

[stt.providers.whisper]
type = "whisper"
api_key = "{{ env.OPENAI_API_KEY }}"

# ------------------------------------
# Text-to-Speech
# ------------------------------------

[tts.providers.openai]
type = "openai_tts"
api_key = "{{ env.OPENAI_API_KEY }}"

# ------------------------------------
# MCP Tool Servers
# ------------------------------------

[mcp.servers.brave_search.type]
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-brave-search"]
env = { BRAVE_API_KEY = "{{ env.BRAVE_API_KEY | default("") }}" }

[mcp.servers.fetch.type]
transport = "stdio"
command = "uvx"
args = ["mcp-server-fetch"]

# ------------------------------------
# API Key Authentication
# ------------------------------------

[auth]
enabled = true
api_url = "{{ env.SYNAPSE_API_URL | default("https://api.synapse.omni.dev") }}"
gateway_secret = "{{ env.GATEWAY_SECRET }}"
cache_ttl_seconds = 60
cache_capacity = 10000
public_paths = ["/health"]

# ------------------------------------
# Billing (Aether integration)
# ------------------------------------

[billing]
enabled = true
billing_url = "{{ env.BILLING_BASE_URL | default("https://api.billing.omni.dev") }}"
service_api_key = "{{ env.BILLING_SERVICE_API_KEY }}"
app_id = "synapse"
mode = "hybrid"
# Degraded: during an Aether outage keep serving but under an emergency token
# ceiling, so availability holds without the outage becoming unmetered spend.
fail_mode = "degraded"

# Modality feature keys (defaults match Aether seed values)
# stt_feature_key = "stt_enabled"
# tts_feature_key = "tts_enabled"
# embeddings_feature_key = "embeddings_enabled"
# image_gen_feature_key = "image_gen_enabled"

[billing.tier_margins]
free = 1.15
pro = 1.15
team = 1.15

# Margin for product-scoped keys (other Omni products billing through this
# gateway). Tier margins above apply only to Synapse's own plans. Products not
# listed here use default_product_margin (2.0, the fleet retail markup)
[billing.product_margins]
facet = 2.0
keystone = 2.0
myfi = 2.0
backfeed = 2.0

# Products that include AI in their SaaS tier (bounded by a monthly fair-use
# allowance, `ai_included_credits` in the catalog), as product to the Aether
# usage meter holding that allowance in credits. Their AI is checked against
# and recorded on the meter, never the pooled credit wallet, and is refused
# with 402 once the period's allowance is used. backfeed (feedback triage
# embeddings) is declared ahead of its rollout so its AI never touches the
# wallet whenever its provisioning env is wired
[billing.included_allowance_products]
myfi = "ai_credits"
backfeed = "ai_credits"

# Chat models each product-scoped key may use, keyed by product. The key's
# GET /v1/models lists exactly these (with display names, the default, and
# retail credit prices), `auto` (and fast/best/cheap without the
# smart_routing entitlement) resolves to the default, and any other model is
# refused with a 400. Every model must be priced above. Products without an
# entry are not restricted. Embeddings, images, and speech are not governed
# by these lists
[billing.products.keystone]
models = ["anthropic/claude-sonnet-5-5", "anthropic/claude-opus-5-5", "anthropic/claude-haiku-5-5"]
default_model = "anthropic/claude-sonnet-5-5"

# facet-api runs Sonnet 5.5 (FACET_AI_MODEL and its fallback, set in IaC);
# Opus 5.5 is the documented max-quality override
[billing.products.facet]
models = ["anthropic/claude-sonnet-5-5", "anthropic/claude-opus-5-5"]
default_model = "anthropic/claude-sonnet-5-5"

# Haiku-class default (D5); paid tiers pick Sonnet explicitly. The picker
# offers the current Claude line, cheapest first: older and other-vendor
# models cost more for less and are no longer listed
[billing.products.beacon]
models = ["anthropic/claude-haiku-5-5", "anthropic/claude-sonnet-5-5", "anthropic/claude-opus-5-5"]
default_model = "anthropic/claude-haiku-5-5"

# creator-api reads its picker from GET /v1/models; Haiku 5.5 by default,
# Sonnet 5.5 for quality, GPT-4o mini as the OpenAI option
[billing.products.creator]
models = ["anthropic/claude-haiku-5-5", "anthropic/claude-sonnet-5-5", "openai/gpt-4o-mini"]
default_model = "anthropic/claude-haiku-5-5"

# myfi sends `auto` for bulk and interactive categorization. Picking two
# accounts from a chart is well within Haiku 5.5, and myfi's AI is an included
# allowance, so no larger model is offered
[billing.products.myfi]
models = ["anthropic/claude-haiku-5-5"]
default_model = "anthropic/claude-haiku-5-5"

[billing.managed_providers.openai]
api_key = "{{ env.OPENAI_API_KEY }}"
margin = 1.0

[billing.managed_providers.anthropic]
api_key = "{{ env.ANTHROPIC_API_KEY }}"
margin = 1.0

[billing.managed_providers.nvidia]
api_key = "{{ env.NVIDIA_API_KEY }}"
margin = 1.0

# ------------------------------------
# Response Cache
# ------------------------------------

[cache]
enabled = true
url = "{{ env.VALKEY_URL }}"
ttl_seconds = 3600

# ------------------------------------
# Guardrails
# ------------------------------------

[guardrails]
enabled = true
check_input = true
check_output = false

[[guardrails.rules]]
type = "max_input_tokens"
name = "input-limit"
limit = 200000
action = "block"

[[guardrails.rules]]
type = "pii"
name = "pii-detection"
detect = ["ssn", "credit_card"]
action = "warn"

# ------------------------------------
# Telemetry
# ------------------------------------

[telemetry]
service_name = "synapse-gateway"

[telemetry.exporter]
endpoint = "{{ env.OTEL_EXPORTER_OTLP_ENDPOINT | default("http://otel-collector:4317") }}"
protocol = "grpc"

[telemetry.tracing]
sampling_rate = 0.1
parent_based = true
propagation = ["trace_context"]
