# Synapse Production Configuration
#
# Baked into the Docker image at /etc/synapse.toml.
# Secrets are interpolated from environment variables at runtime.

[server]
listen_address = "[::]:3000"

[server.health]
enabled = true
path = "/health"

[server.rate_limit]
[server.rate_limit.storage]
type = "cache"
url = "{{ env.VALKEY_URL }}"

[server.rate_limit.global]
requests = 1000
window = "1m"

[server.rate_limit.per_ip]
requests = 120
window = "1m"

[server.cors]
origins = ["https://synapse.omni.dev"]
methods = ["GET", "POST", "OPTIONS"]
headers = ["Content-Type", "Authorization", "X-Api-Key"]
credentials = true
max_age = 3600

# ------------------------------------
# LLM Providers
# ------------------------------------

[llm.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"

[llm.providers.anthropic]
type = "anthropic"
api_key = "{{ env.ANTHROPIC_API_KEY }}"

[llm.providers.nvidia]
type = "openai"
base_url = "https://integrate.api.nvidia.com/v1"
api_key = "{{ env.NVIDIA_API_KEY }}"

# ------------------------------------
# Intelligent Routing
# ------------------------------------

[llm.routing]
enabled = true
strategy = "threshold"

[llm.routing.threshold]
low_complexity_model = "openai/gpt-4o-mini"
high_complexity_model = "anthropic/claude-sonnet-4-5-20250929"
quality_floor = 0.7

[[llm.routing.models]]
provider = "openai"
model = "gpt-4o-mini"
input_per_mtok = 0.15
output_per_mtok = 0.60
quality = 0.7
context_window = 128000
[llm.routing.models.capabilities]
tool_calling = true
vision = true

[[llm.routing.models]]
provider = "openai"
model = "gpt-4o"
input_per_mtok = 2.50
output_per_mtok = 10.00
quality = 0.88
context_window = 128000
[llm.routing.models.capabilities]
tool_calling = true
vision = true

[[llm.routing.models]]
