# ------------------------------------
# Failover
# ------------------------------------

[llm.failover]
enabled = true
max_attempts = 2

[[llm.failover.equivalence_groups]]
name = "frontier"
models = ["anthropic/claude-opus-4-6", "anthropic/claude-sonnet-4-5-20250929", "openai/gpt-4o", "nvidia/moonshotai/kimi-k2.5"]

[[llm.failover.equivalence_groups]]
name = "fast"
models = ["openai/gpt-4o-mini", "anthropic/claude-haiku-4-5-20251001"]

[llm.failover.circuit_breaker]
error_threshold = 5
window_seconds = 60
recovery_seconds = 30

# ------------------------------------
# Embeddings
# ------------------------------------

[embeddings.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"

# ------------------------------------
# Image Generation
# ------------------------------------

[imagegen.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"

# ------------------------------------
# Speech-to-Text
# ------------------------------------

[stt.providers.whisper]
type = "whisper"
api_key = "{{ env.OPENAI_API_KEY }}"

# ------------------------------------
# Text-to-Speech
# ------------------------------------

[tts.providers.openai]
type = "openai_tts"
api_key = "{{ env.OPENAI_API_KEY }}"

# ------------------------------------
# MCP Tool Servers
# ------------------------------------

[mcp.servers.brave_search.type]
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-brave-search"]
env = { BRAVE_API_KEY = "{{ env.BRAVE_API_KEY | default("") }}" }

[mcp.servers.fetch.type]
transport = "stdio"
command = "uvx"
args = ["mcp-server-fetch"]

# ------------------------------------
# API Key Authentication
# ------------------------------------

[auth]
enabled = true
api_url = "{{ env.SYNAPSE_API_URL | default("https://api.synapse.omni.dev") }}"
gateway_secret = "{{ env.GATEWAY_SECRET }}"
cache_ttl_seconds = 60
cache_capacity = 10000
public_paths = ["/health"]

# ------------------------------------
# Billing (Aether integration)
# ------------------------------------

[billing]
enabled = true
billing_url = "{{ env.BILLING_BASE_URL | default("https://api.billing.omni.dev") }}"
service_api_key = "{{ env.BILLING_SERVICE_API_KEY }}"
app_id = "synapse"
mode = "hybrid"
# Degraded: during an Aether outage keep serving but under an emergency token
# ceiling, so availability holds without the outage becoming unmetered spend.
fail_mode = "degraded"

# Modality feature keys (defaults match Aether seed values)
# stt_feature_key = "stt_enabled"
# tts_feature_key = "tts_enabled"
# embeddings_feature_key = "embeddings_enabled"
# image_gen_feature_key = "image_gen_enabled"

[billing.tier_margins]
free = 1.15
pro = 1.15
team = 1.15

# Margin for product-scoped keys (other Omni products billing through this
# gateway). Tier margins above apply only to Synapse's own plans. Products not
# listed here use default_product_margin (2.0, the fleet retail markup)
[billing.product_margins]
facet = 2.0
keystone = 2.0
myfi = 2.0

# Products that include AI in their SaaS tier (bounded by a monthly fair-use
# allowance, `ai_included_credits` in the catalog), as product to the Aether
# usage meter holding that allowance in credits. Their AI is checked against
# and recorded on the meter, never the pooled credit wallet, and is refused
# with 402 once the period's allowance is used
[billing.included_allowance_products]
myfi = "ai_credits"

[billing.managed_providers.openai]
api_key = "{{ env.OPENAI_API_KEY }}"
margin = 1.0

[billing.managed_providers.anthropic]
api_key = "{{ env.ANTHROPIC_API_KEY }}"
margin = 1.0

[billing.managed_providers.nvidia]
api_key = "{{ env.NVIDIA_API_KEY }}"
margin = 1.0

# ------------------------------------
# Response Cache
# ------------------------------------

[cache]
enabled = true
url = "{{ env.VALKEY_URL }}"
ttl_seconds = 3600

# ------------------------------------
# Guardrails
# ------------------------------------

[guardrails]
enabled = true
check_input = true
check_output = false

[[guardrails.rules]]
type = "max_input_tokens"
name = "input-limit"
limit = 200000
action = "block"

[[guardrails.rules]]
type = "pii"
name = "pii-detection"
detect = ["ssn", "credit_card"]
action = "warn"

# ------------------------------------
# Telemetry
# ------------------------------------

[telemetry]
service_name = "synapse-gateway"

[telemetry.exporter]
endpoint = "{{ env.OTEL_EXPORTER_OTLP_ENDPOINT | default("http://otel-collector:4317") }}"
protocol = "grpc"

[telemetry.tracing]
sampling_rate = 0.1
parent_based = true
propagation = ["trace_context"]
